name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch'
        required: true
        type: choice
        options:
          - fourteen
          - fifteen
          - sixteen
        default: fourteen
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve branch and zip name
        id: vars
        run: |
          if [ "${{ inputs.branch }}" = "fourteen" ]; then
            echo "kernel_branch=fourteen" >> "$GITHUB_OUTPUT"
            echo "zip_suffix=Kona-raphael" >> "$GITHUB_OUTPUT"
          else
            echo "kernel_branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "zip_suffix=raphael" >> "$GITHUB_OUTPUT"
          fi

      - name: Install required packages
        run: |
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|mirror://mirrors.ubuntu.com/mirrors.txt|g' /etc/apt/sources.list
          sudo apt-get update -y
          sudo apt-get install -y \
                    build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
                    zstd dwarves cpio python-is-python3 device-tree-compiler curl zip gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu

      - name: Checkout Kernel
        run: |
          git clone -b ${{ steps.vars.outputs.kernel_branch }} https://github.com/Marcondesource/kernel_xiaomi_raphael --depth=1 kernel
          # Neutron's current clang (24.x) no longer ships the MLGO regalloc model,
          # and requesting it is a fatal error. Drop the hardcoded advisor flag.
          sed -i '/regalloc-enable-advisor/d' kernel/Makefile
          grep -n "regalloc-enable-advisor" kernel/Makefile || echo "MLGO regalloc flags removed"

      - name: Setup Neutron Clang via AntMan
        run: |
          mkdir -p $HOME/tc/neutron-clang
          cd $HOME/tc/neutron-clang
          curl -LSs https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
          chmod +x antman
          ./antman -S
          
      - name: Generate defconfig
        working-directory: kernel
        run: |
          mkdir -p out
          export PATH="$HOME/tc/neutron-clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang HOSTCC=clang HOSTCXX=clang++ LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- raphael_defconfig
          make O=out ARCH=arm64 CC=clang HOSTCC=clang HOSTCXX=clang++ LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH="$HOME/tc/neutron-clang/bin:$PATH" 
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang HOSTCC=clang HOSTCXX=clang++ LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error=vla-extension -Wno-error=unused-command-line-argument" Image.gz-dtb dtbs

      - name: Prepare AnyKernel3
        run: |
          mkdir -p output
          git clone --depth=1 https://github.com/Marcondesource/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          find kernel/out/ -name "dtbo.img" -exec cp {} AnyKernel3/ \; 2>/dev/null || true
          find kernel/out/arch/arm64/boot/dts/vendor/qcom/ -name "*.dtb" -exec cat {} + > AnyKernel3/dtb 2>/dev/null || find kernel/out/arch/arm64/boot/dts/ -name "*.dtb" -exec cat {} + > AnyKernel3/dtb 2>/dev/null || true
          cd AnyKernel3
          zip -r9 ../output/AnyKernel3-${{ steps.vars.outputs.zip_suffix }}-${{ github.run_number }}.zip . -x ".git/*" ".github/*" "README.md" "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Ayanami Kernel - Run ${{ github.run_number }}
          body: |
            Device: Raphael
            Branch: ${{ steps.vars.outputs.kernel_branch }}
            Kernel: Ayanami
            Compiler: Neutron Clang
            Build #${{ github.run_number }}
          files: |
            output/AnyKernel3-${{ steps.vars.outputs.zip_suffix }}-${{ github.run_number }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
