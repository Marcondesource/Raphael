name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Install required packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
                   build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
                   zstd dwarves cpio python-is-python3 device-tree-compiler curl ccache zip

      - name: Checkout Kernel
        run: |
          git clone -b Ayanami --recursive https://github.com/MatrixhKa/android_kernel_motorola_sm6225 --depth=1 kernel

      - name: Setup AOSP Clang
        run: |
          mkdir -p ~/clang && cd ~/clang
          wget https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r563880c-13989888/clang-r563880c.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz

      - name: Generate defconfig
        working-directory: kernel
        run: |
          make ARCH=arm64 O=out vendor/bengal-perf_defconfig vendor/ext_config/moto-bengal.config vendor/ext_config/rhode-default.config

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH=~/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          
          make -j$(nproc --all) Image.gz-dtb O=out

      - name: Prepare Release Files
        run: |
          mkdir -p output
          cp kernel/out/arch/arm64/boot/Image.gz-dtb output/
          # Zipar a pasta DTS para facilitar o download na release
          zip -r output/Device-Tree-Source.zip kernel/out/arch/arm64/boot/dts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Kernel Build - Run ${{ github.run_number }}
          body: |
            ### Kernel Build Information
            - **Device:** Motorola SM6225
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            output/Image.gz-dtb
            output/Device-Tree-Source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
