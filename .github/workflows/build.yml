name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Remove unused packages
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
   
      - name: Install required packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
                       build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
                       zstd dwarves cpio python-is-python3 device-tree-compiler curl ccache
    
      - name: Checkout Kernel
        run: |
          git clone -b pixel --recursive https://github.com/MatrixhKa/android_kernel_motorola_sm6225 --depth=1 kernel

     # - name: Download patches and apply
     #   working-directory: kernel
     #   run: |
     #    cd KernelSU
     #     wget https://raw.githubusercontent.com/MatrixhKal/KSU-PATCHES/refs/heads/main/fix_umount_manager.patch
     #     patch -p1 <fix_umount_manager.patch

      - name: Setup AOSP Clang
        run: |
          mkdir -p ~/clang && cd ~/clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r574158.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz

      - name: Generate defconfig
        working-directory: kernel
        run: |
          make ARCH=arm64 O=out vendor/bengal-perf_defconfig vendor/ext_config/moto-bengal.config vendor/ext_config/rhode-default.config
          
      - name: Build Kernel
        working-directory: kernel
        run: |
          ccache -M 10G
          ccache -o compression=true
          export PATH=~/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export USE_CCACHE=1
          export CC=ccache clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          
          make -j$(nproc --all) Image.gz-dtb O=out

      - name: Collect kernel modules
        working-directory: kernel
        run: |
          mkdir -p ~/modules-out
          mkdir -p ~/modules-out/dlkm
    
          find out/ -type f -name "*.ko" -exec cp {} ~/modules-out/ \;
          find ~/modules-out/ -maxdepth 1 -type f -name "*_dlkm.ko" -exec mv {} ~/modules-out/dlkm/ \;

      - name: Upload kernel modules
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Modules
          path: ~/modules-out

      - name: Upload Device Tree Source (DTS)
        uses: actions/upload-artifact@v4
        with:
          name: Device-Tree-Source-DTS
          path: kernel/out/arch/arm64/boot/dts

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
