name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install required packages
        run: |
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|mirror://mirrors.ubuntu.com/mirrors.txt|g' /etc/apt/sources.list
          sudo apt update -y
          sudo apt-get update -y
          sudo apt-get install -y \
                   build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
                   zstd dwarves cpio python-is-python3 device-tree-compiler curl zip

      - name: Setup ccache
        run: |
          sudo apt-get install -y ccache
          sudo /usr/sbin/update-ccache-symlinks
          echo 'export PATH="/usr/lib/ccache:$PATH"' | tee -a ~/.bashrc
          source ~/.bashrc
          ccache -M 5G
          ccache -o compression=true
          ccache -s

      - name: Checkout Kernel
        run: |
          git clone -b Ayanami-rc2 https://github.com/MatrixhKa/android_kernel_motorola_sm6225 --depth=1 kernel

      - name: Setup AOSP Clang
        run: |
          mkdir -p ~/clang && cd ~/clang
          wget https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r596125-15241605/clang-r596125.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz
          rm -f clang.tar.gz

      - name: Generate defconfig
        working-directory: kernel
        run: |
          export PATH=~/clang/bin:/usr/lib/ccache:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="ccache clang"
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          
          make ARCH=arm64 O=out vendor/bengal-perf_defconfig vendor/ext_config/moto-bengal.config vendor/ext_config/rhode-default.config vendor/ayanami.config
          
      - name: Setup KernelSU
        working-directory: kernel
        run: |
          curl -LSs "https://github.com/rsuntk/KernelSU/raw/refs/heads/staging/xxksu/kernel/setup.sh" | bash -s
          #curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s 9bb2d6c5099f124f56a156f66308d590389b5064
          #curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s 948acae9f0fe55a4b72bfdb7e85a491b6a99454b

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH=~/clang/bin:/usr/lib/ccache:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="ccache clang"
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld

          make -j$(nproc --all) O=out

      - name: Show ccache statistics
        run: |
          ccache -s

      - name: Prepare Release Files
        run: |
          mkdir -p output && 
          cp kernel/out/arch/arm64/boot/Image.gz output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Kernel Build - Run ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            output/Image.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
