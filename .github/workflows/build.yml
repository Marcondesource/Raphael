name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install required packages
        run: |
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|mirror://mirrors.ubuntu.com/mirrors.txt|g' /etc/apt/sources.list
          sudo apt update -y
          sudo apt-get update -y
          sudo apt-get install -y \
                   build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
                   zstd dwarves cpio python-is-python3 device-tree-compiler curl zip

      - name: Checkout Kernel
        run: |
          git clone -b Ayanami-rc2 https://github.com/MatrixhKa/android_kernel_motorola_sm6225 --depth=1 kernel

      - name: Setup AOSP Clang
        run: |
          mkdir -p ~/clang && cd ~/clang
          #wget https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r596125-15241605/clang-r596125.tar.gz -O clang.tar.gz
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/26052026/neutron-clang-26052026.tar.zst -O clang.tar.zst
          tar -xvf clang.tar.zst
          rm -f clang.tar.zst

      - name: Generate defconfig
        working-directory: kernel
        run: |
          mkdir -p out
          sh scripts/kconfig/merge_config.sh -m -O out/ arch/arm64/configs/vendor/bengal-perf_defconfig arch/arm64/configs/vendor/ext_config/moto-bengal.config arch/arm64/configs/vendor/ext_config/rhode-default.config arch/arm64/configs/vendor/ayanami.config
          
      - name: Setup KernelSU
        working-directory: kernel
        run: |
          curl -LSs  "https://github.com/ReSukiSU/ReSukiSU/raw/refs/heads/main/kernel/setup.sh" | bash -s

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH=~/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld

          make -j$(nproc --all) O=out

      - name: Prepare Release Files
        run: |
          mkdir -p output && 
          cp kernel/out/arch/arm64/boot/Image.gz output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Kernel Build - Run ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            output/Image.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
