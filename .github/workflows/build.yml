name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Install required packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
                   build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
                   zstd dwarves cpio python-is-python3 device-tree-compiler curl zip

      - name: Checkout Kernel
        run: |
          git clone -b Ayanami-wip https://github.com/MatrixhKa/android_kernel_motorola_sm6225 --depth=1 kernel

      - name: Setup AOSP Clang
        run: |
          mkdir -p ~/clang && cd ~/clang
          wget https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r574158-14475230/clang-r574158.tar.gz -O clang.tar.gz
          #wget https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260119-release/Clang-23.0.0git-20260119.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz

      - name: Generate defconfig
        working-directory: kernel
        run: |
          make ARCH=arm64 O=out vendor/bengal-perf_defconfig vendor/ext_config/moto-bengal.config vendor/ext_config/rhode-default.config
          
      - name: Setup KernelSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s master
 
      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH=~/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld

          make -j$(nproc --all) O=out

      - name: Prepare Release Files
        run: |
          mkdir -p output && 
          cp kernel/out/arch/arm64/boot/Image.gz output/
          #cp kernel/out/arch/arm64/boot/dtbo.img output/
          #cp kernel/out/arch/arm64/boot/dtb.img  output/

          #zip -r out.zip kernel/out/arch/arm64/
          #mv out.zip output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Kernel Build - Run ${{ github.run_number }}
          body: |
            ### Kernel Build Information
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            output/Image.gz
            #output/dtbo.img
            #output/dtb.img
            #output/out.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
