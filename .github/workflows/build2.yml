name: Build Kernel2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h
          
          # Remove unnecessary packages
          sudo apt-get remove -y \
            '^ghc-*' \
            '^dotnet-*' \
            '^llvm-*' \
            'php*' \
            'mysql-server*' \
            'postgresql*' \
            'openjdk-*' \
            'adoptopenjdk-*' \
            'google-cloud-sdk' \
            'azure-cli' \
            'powershell' \
            'mono-*' \
            'ruby*' \
            'default-jdk*' \
            'esl-erlang' || true
          
          # Clean apt cache
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          sudo apt-get clean
          
          # Remove Docker images
          docker rmi -f $(docker images -aq) || true
          
          # Remove large directories
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/google/chrome
          sudo rm -rf /opt/microsoft/powershell
          
          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Install required packages
        run: |
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|mirror://mirrors.ubuntu.com/mirrors.txt|g' /etc/apt/sources.list
          sudo apt update -y
          sudo apt-get update -y
          sudo apt-get install -y \
                   build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
                   zstd dwarves cpio python-is-python3 device-tree-compiler curl zip

      - name: Checkout Kernel
        run: |
          git clone -b Ayanami-rc2 https://github.com/MatrixhKa/android_kernel_motorola_sm6225 --depth=1 kernel

      - name: Setup AOSP Clang
        run: |
          mkdir -p ~/clang && cd ~/clang
          wget https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r596125-15241605/clang-r596125.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz
          rm -f clang.tar.gz

      - name: Generate defconfig
        working-directory: kernel
        run: |
          export PATH=~/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          
          make ARCH=arm64 O=out vendor/bengal-perf_defconfig vendor/ext_config/moto-bengal.config vendor/ext_config/rhode-default.config
          
      - name: Setup KernelSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s main

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH=~/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld

          make -j$(nproc --all) O=out

      - name: Prepare Release Files
        run: |
          mkdir -p output && 
          cp kernel/out/arch/arm64/boot/Image.gz output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Kernel Build - Run ${{ github.run_number }}
          body: |
            ### Kernel Build Information
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            output/Image.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
